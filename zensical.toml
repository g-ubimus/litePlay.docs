[project]
site_name = "litePlay.js docs"
site_url = "https://g-ubimus.github.io/litePlay.docs/"
repo_url = "https://github.com/g-ubimus/litePlay.js"
site_description = "Documentation for the litePlay.js lite coding library."
site_author = "g-ubimus"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  {"Getting started" = "index.md"},
  {"play()" = "play.md"},
  {"eventList" = "eventList.md"},
  {"Generators" = "generators.md"},
  {"sequencer" = "sequencer.md"},
  {"Sampling" = "sampling.md"},
  {"Instruments" = "instruments.md"},
  {"Effects" = "effects.md"},
  {"Musical structures" = "structures.md"},
  {"Examples" = "examples.md"},
  {"litePlay.js editor" = "https://g-ubimus.github.io/litePlay.js"}
]

[project.theme]
variant = "modern"
features = [
    "navigation.expand",
    "toc.follow",
    "toc.integrate",
    "content.code.copy"
]
favicon = "images/favicon.png"

[project.theme.icon]
logo = "lucide/book-headphones"

# Palette toggle for light mode
[[project.theme.palette]]
primary = "green"
accent = "light green"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
primary = "green"
accent = "light green"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
    { name = "English", link = "/litePlay.docs/", lang = "en" },
    { name = "Português", link = "/litePlay.docs/pt/", lang = "pt-BR" }
]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 2

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]

